<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Sim</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:ui-monospace,Menlo,Consolas,monospace;color:#cfe}
canvas{display:block}
#hud{position:fixed;left:12px;top:12px;background:rgba(0,20,10,.55);padding:10px 14px;border:1px solid #3f8;border-radius:8px;line-height:1.55;font-size:14px;min-width:210px}
#hud b{color:#7fb}
#warn{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:bold;color:#f44;text-shadow:0 0 8px #000;display:none}
#adi{position:fixed;right:12px;bottom:12px;border-radius:50%;border:2px solid #3f8;background:#000}
#help{position:fixed;left:12px;bottom:12px;font-size:12px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:8px;line-height:1.5}
#msg{position:fixed;inset:0;display:none;background:rgba(0,0,0,.65);text-align:center;padding-top:30vh;font-size:20px}
</style>
</head>
<body>
<div id="hud"></div><div id="warn"></div>
<canvas id="adi" width="170" height="170"></canvas>
<div id="help">
<b>W/↑</b> picchia · <b>S/↓</b> cabra · <b>A/D</b> alettoni · <b>Q/E</b> timone<br>
<b>Z/X</b> motore +/− (o tasti <b>0-9</b>) · <b>B</b> freni · <b>F/V</b> flap +/−<br>
<b>G</b> carrello · <b>,</b> <b>.</b> trim · <b>C</b> camera · <b>P</b> pausa · <b>R</b> riparti
</div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R2D=180/Math.PI, KT=1.94384, FT=3.28084, V3=THREE.Vector3, UP=new V3(0,1,0);
const MASS=1100, WING=16.2;

/* ---------- scena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const SKY=0x9cc7e8;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,3000,22000);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.5,60000);
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x4a5a3a,0.85));
const sun=new THREE.DirectionalLight(0xfff2d8,1.0);
sun.position.set(-3000,5000,2000);
scene.add(sun);

/* ---------- terreno procedurale ---------- */
function hash(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z){let s=0,a=.5;for(let i=0;i<5;i++){s+=a*vnoise(x,z);x*=2.03;z*=2.03;a*=.5}return s}
function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
function terrainH(x,z){
  let h=(fbm(x*0.00022+10,z*0.00022+10)-0.45)*1600;
  h=h>0?h*(0.5+h/700):h*0.4;
  const f=smooth(2500,6500,Math.hypot(x,z));   // zona piatta intorno alla pista
  return 2+(h-2)*f;
}
const SIZE=40000,SEG=400,STEP=SIZE/SEG,W1=SEG+1;
const H=new Float32Array(W1*W1);
{
  const g=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,colors=new Float32Array(pos.count*3),c=new THREE.Color(),t=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i),h=terrainH(x,z);
    H[i]=h;pos.setY(i,h);
    const n=hash(Math.floor(x/70),Math.floor(z/70))*.1;
    c.setRGB(.76,.7,.5);
    c.lerp(t.setRGB(.2+n,.42+n,.16),smooth(1,8,h));
    c.lerp(t.setRGB(.42+n,.4+n,.36+n),smooth(450,700,h));
    c.lerp(t.setRGB(.95,.95,.97),smooth(950,1100,h));
    colors.set([c.r,c.g,c.b],i*3);
  }
  g.setAttribute('color',new THREE.BufferAttribute(colors,3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
}
function groundAt(x,z){
  const u=(x+SIZE/2)/STEP,v=(z+SIZE/2)/STEP;
  if(u<0||v<0||u>=SEG||v>=SEG)return 0;
  const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j;
  const a=H[j*W1+i],b=H[j*W1+i+1],c=H[(j+1)*W1+i],d=H[(j+1)*W1+i+1];
  return (a*(1-fu)+b*fu)*(1-fv)+(c*(1-fu)+d*fu)*fv;
}
// mare
{
  const w=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE).rotateX(-Math.PI/2),
    new THREE.MeshPhongMaterial({color:0x1f5f8f,shininess:90,transparent:true,opacity:.88}));
  scene.add(w);
}
// pista (2000 m, orientata a nord) con segnaletica
{
  const c=document.createElement('canvas');c.width=64;c.height=1024;
  const x=c.getContext('2d');
  x.fillStyle='#3a3a3d';x.fillRect(0,0,64,1024);
  x.fillStyle='#eee';
  for(let y=40;y<984;y+=48)x.fillRect(30,y,4,26);
  x.fillRect(3,0,2,1024);x.fillRect(59,0,2,1024);
  for(let k=0;k<6;k++){x.fillRect(8+k*8,10,4,34);x.fillRect(8+k*8,980,4,34)}
  const tex=new THREE.CanvasTexture(c);
  const r=new THREE.Mesh(new THREE.PlaneGeometry(45,2000).rotateX(-Math.PI/2),
    new THREE.MeshLambertMaterial({map:tex,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
  r.position.set(0,2.05,0);scene.add(r);
  const hm=new THREE.MeshLambertMaterial({color:0x9aa0a6});
  for(let i=0;i<3;i++){
    const h=new THREE.Mesh(new THREE.BoxGeometry(30,9,22),hm);
    h.position.set(90,6.5,500+i*45);scene.add(h);
  }
  const tw=new THREE.Mesh(new THREE.BoxGeometry(8,26,8),new THREE.MeshLambertMaterial({color:0xdddddd}));
  tw.position.set(-80,15,300);scene.add(tw);
}
// alberi (istanziati)
{
  const N=5000,m=new THREE.InstancedMesh(new THREE.ConeGeometry(4,14,6).translate(0,7,0),
    new THREE.MeshLambertMaterial({color:0x1f4d22}),N);
  const d=new THREE.Object3D();let n=0;
  for(let t=0;t<40000&&n<N;t++){
    const x=(Math.random()-.5)*18000,z=(Math.random()-.5)*18000,h=groundAt(x,z);
    if(h<8||h>450)continue;
    d.position.set(x,h,z);d.scale.setScalar(.7+Math.random()*.9);d.updateMatrix();
    m.setMatrixAt(n++,d.matrix);
  }
  m.count=n;scene.add(m);
}
// nuvole
{
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const mat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false});
  for(let i=0;i<130;i++){
    const cx=(Math.random()-.5)*34000,cz=(Math.random()-.5)*34000,cy=1400+Math.random()*1200;
    for(let k=0;k<6;k++){
      const s=new THREE.Sprite(mat),sc=500+Math.random()*700;
      s.scale.set(sc*1.6,sc*.7,1);
      s.position.set(cx+(Math.random()-.5)*900,cy+(Math.random()-.5)*120,cz+(Math.random()-.5)*900);
      scene.add(s);
    }
  }
}

/* ---------- modello aereo ---------- */
const plane=new THREE.Group();scene.add(plane);
const M=c=>new THREE.MeshPhongMaterial({color:c,shininess:50});
const white=M(0xf2f2f2),red=M(0xc62828),dark=M(0x1c1c1c);
const glass=new THREE.MeshPhongMaterial({color:0x6fa8d6,transparent:true,opacity:.55});
const add=(g,m,x,y,z,p=plane)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
add(new THREE.CylinderGeometry(.28,.6,5.6,16),white,0,0,.2).rotation.x=Math.PI/2;
add(new THREE.ConeGeometry(.6,.9,16),red,0,0,-3.05).rotation.x=-Math.PI/2;
add(B(.9,.45,1.4),glass,0,.55,-.7);
add(B(11,.1,1.7),white,0,.7,-.4);
add(B(3.6,.08,.9),white,0,.2,2.7);
add(B(.08,1.2,1.1),red,0,.8,2.6);
const elevator=add(B(3.6,.06,.45),red,0,.2,3.3);
const ailL=add(B(2.2,.06,.4),red,-4.3,.7,.65),ailR=add(B(2.2,.06,.4),red,4.3,.7,.65);
const flapL=add(B(2.4,.06,.4),red,-2,.7,.65),flapR=add(B(2.4,.06,.4),red,2,.7,.65);
const prop=new THREE.Group();prop.position.set(0,0,-3.55);plane.add(prop);
add(B(.12,2.1,.06),dark,0,0,0,prop);
const gears=[];
function gear(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  add(B(.08,1,.08),dark,0,-.5,0,g);
  add(new THREE.CylinderGeometry(.2,.2,.12,12),dark,0,-.95,0,g).rotation.z=Math.PI/2;
  plane.add(g);gears.push(g);
}
gear(0,-1.6);gear(-1.1,.2);gear(1.1,.2);

/* ---------- stato ---------- */
const S={pos:plane.position,q:plane.quaternion,vel:new V3(),rp:0,qr:0,yr:0,thr:0,flaps:0,gear:1,gearAnim:1,
  brake:0,trim:.05,crashed:false,onGround:true,alpha:0,stall:false,in:{pitch:0,roll:0,yaw:0}};
const camQ=new THREE.Quaternion();
let cam=0,paused=false;
const msg=document.getElementById('msg');
function reset(){
  S.pos.set(0,groundAt(0,900)+1.15,900);S.vel.set(0,0,0);S.q.identity();
  S.rp=S.qr=S.yr=0;S.thr=0;S.flaps=0;S.gear=1;S.gearAnim=1;S.trim=.05;
  S.crashed=false;S.onGround=true;camQ.copy(S.q);msg.style.display='none';
}
function crash(why){
  S.crashed=true;S.vel.set(0,0,0);
  msg.innerHTML=`<h1>💥 ${why}</h1><p>Premi R per ripartire</p>`;msg.style.display='block';
}
reset();

/* ---------- input ---------- */
const K={};
addEventListener('keydown',e=>{
  K[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='KeyG')S.gear=1-S.gear;
  if(e.code==='KeyF')S.flaps=Math.min(1,S.flaps+.25);
  if(e.code==='KeyV')S.flaps=Math.max(0,S.flaps-.25);
  if(e.code==='KeyC')cam=(cam+1)%3;
  if(e.code==='KeyR')reset();
  if(e.code==='KeyP')paused=!paused;
  if(/^Digit\d$/.test(e.code))S.thr=(+e.code[5])/9;
});
addEventListener('keyup',e=>K[e.code]=false);
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
});
function inputs(dt){
  const I=S.in,t=(a,b)=>(K[a]||K[b]?1:0),k=Math.min(1,dt*4);
  I.pitch+=((t('KeyS','ArrowDown')-t('KeyW','ArrowUp'))-I.pitch)*k;
  I.roll+=((t('KeyD','ArrowRight')-t('KeyA','ArrowLeft'))-I.roll)*k;
  I.yaw+=((t('KeyE','KeyE')-t('KeyQ','KeyQ'))-I.yaw)*k;
  if(K.KeyZ)S.thr=Math.min(1,S.thr+.5*dt);
  if(K.KeyX)S.thr=Math.max(0,S.thr-.5*dt);
  if(K.Comma)S.trim=Math.max(-.1,S.trim-.04*dt);
  if(K.Period)S.trim=Math.min(.25,S.trim+.04*dt);
  S.brake=K.KeyB?1:0;
  const d=S.gear-S.gearAnim;
  S.gearAnim+=Math.sign(d)*Math.min(Math.abs(d),.4*dt);
}

/* ---------- fisica ---------- */
function step(dt){
  if(S.crashed)return;
  const q=S.q,pos=S.pos,vel=S.vel,I=S.in;
  const rho=1.225*Math.exp(-pos.y/8500),dens=rho/1.225;
  const fwd=new V3(0,0,-1).applyQuaternion(q),right=new V3(1,0,0).applyQuaternion(q);
  const vb=vel.clone().applyQuaternion(q.clone().invert());
  const V=vel.length();
  let alpha=0,beta=0;
  if(V>2){alpha=Math.atan2(-vb.y,-vb.z);beta=Math.max(-.6,Math.min(.6,Math.atan2(vb.x,Math.max(.5,-vb.z))))}
  const fl=S.flaps,aMax=.30+.04*fl,aa=Math.abs(alpha),over=Math.max(0,aa-aMax);
  S.alpha=alpha;S.stall=over>0&&V>8;
  // coefficienti aerodinamici
  let CL=.25+.45*fl+5*Math.max(-aMax,Math.min(aMax,alpha));
  if(over>0)CL*=Math.max(.45,1-4*over);
  const CD=.028+.04*fl+.012*S.gearAnim+.06*CL*CL+Math.min(.9,over*3);
  const dyn=.5*rho*V*V*WING;
  const vd=V>.5?vel.clone().divideScalar(V):fwd.clone();
  const F=new V3();
  const ld=right.clone().cross(vd);
  if(ld.lengthSq()>1e-6)F.addScaledVector(ld.normalize(),dyn*CL);   // portanza
  F.addScaledVector(vd,-dyn*CD);                                     // resistenza
  F.addScaledVector(right,-dyn*1.2*beta);                            // forza laterale
  F.addScaledVector(fwd,S.thr*Math.min(3200,98400*(.12+.88*dens)/Math.max(V,12))); // spinta elica
  F.y-=9.81*MASS;
  // turbolenza leggera
  F.x+=(Math.random()-.5)*MASS*.6;F.y+=(Math.random()-.5)*MASS*.6;F.z+=(Math.random()-.5)*MASS*.6;

  // dinamica angolare
  const eff=Math.min(1.6,(V/32)**2)+.08*S.thr;
  const k=Math.min(1,dt*3.5);
  const pT=I.pitch*.8*eff*(S.stall?.5:1)+(S.trim-alpha)*.8*Math.min(1,eff);
  S.qr+=(pT-S.qr)*k;
  S.rp+=(I.roll*2*eff-beta*.6*eff-S.rp)*Math.min(1,dt*4);
  let yT=-I.yaw*.5*eff-beta*1.5*eff;
  if(S.onGround){
    const vf=vel.dot(new V3(fwd.x,0,fwd.z).normalize());
    yT=-I.yaw*.55*Math.min(1,Math.abs(vf)/6);
  }
  S.yr+=(yT-S.yr)*k;
  q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(S.qr*dt,S.yr*dt,-S.rp*dt))).normalize();

  // integrazione
  vel.addScaledVector(F,dt/MASS);
  pos.addScaledVector(vel,dt);

  // contatto col suolo
  const gh=groundAt(pos.x,pos.z),surf=Math.max(gh,0),water=gh<.2,hc=.6+.55*S.gearAnim;
  if(pos.y-surf-hc<=0){
    const e=new THREE.Euler().setFromQuaternion(q,'YXZ');
    const hs=Math.hypot(vel.x,vel.z);
    if(water)return crash('Ammaraggio in mare');
    if(!S.onGround){
      if(-vel.y>5.5)return crash('Atterraggio troppo duro');
      if(Math.abs(e.z)>.6)return crash('Atterraggio con ala troppo inclinata');
      if(e.x<-.4)return crash('Impatto a muso in giù');
      if(S.gearAnim<.9&&hs>22)return crash('Atterraggio senza carrello');
    }
    const fh=new V3(fwd.x,0,fwd.z).normalize(),ga=groundAt(pos.x+fh.x*30,pos.z+fh.z*30);
    if(hs>25&&ga-gh>10)return crash('Impatto contro il terreno');
    S.onGround=true;pos.y=surf+hc;if(vel.y<0)vel.y=0;
    // attrito e frenata
    const rh=fh.clone().cross(UP);
    let vf=vel.dot(fh),vl=vel.dot(rh);
    vl*=Math.exp(-dt*6);
    const offRw=Math.abs(pos.x)>30||Math.abs(pos.z)>1020;
    const res=(.025+.55*S.brake+(offRw?.08:0))*9.81*dt;
    vf-=Math.sign(vf)*Math.min(Math.abs(vf),res);
    vel.copy(fh.multiplyScalar(vf)).addScaledVector(rh,vl).y=vel.y;
    // assetto a terra: niente muso sotto l'orizzonte, ali livellate
    e.x=Math.max(0,Math.min(.28,e.x));e.z*=Math.exp(-dt*6);S.rp=0;
    q.setFromEuler(e);
  }else S.onGround=false;
}

/* ---------- grafica e HUD ---------- */
const hudEl=document.getElementById('hud'),warn=document.getElementById('warn');
const adi=document.getElementById('adi').getContext('2d');
function drawADI(pitch,rollZ){
  const R=85,x=adi;
  x.clearRect(0,0,170,170);x.save();
  x.beginPath();x.arc(R,R,R-2,0,7);x.clip();
  x.translate(R,R);x.rotate(rollZ);x.translate(0,pitch*R2D*2.4);
  x.fillStyle='#4a86c5';x.fillRect(-300,-600,600,600);
  x.fillStyle='#7a5a32';x.fillRect(-300,0,600,600);
  x.strokeStyle='#fff';x.lineWidth=2;x.fillStyle='#fff';x.font='10px monospace';
  for(let d=-30;d<=30;d+=10){
    const y=-d*2.4,w=d===0?300:(d%20===0?30:18);
    x.beginPath();x.moveTo(-w,y);x.lineTo(w,y);x.stroke();
    if(d&&d%20===0)x.fillText(Math.abs(d),w+4,y+3);
  }
  x.restore();
  x.strokeStyle='#ff0';x.lineWidth=3;x.beginPath();
  x.moveTo(30,R);x.lineTo(70,R);x.moveTo(100,R);x.lineTo(140,R);x.moveTo(R,R-4);x.lineTo(R,R+4);x.stroke();
}
function visuals(dt){
  if(!S.crashed)prop.rotation.z+=(S.thr*70+6)*dt;
  gears.forEach(g=>{g.scale.y=Math.max(.01,S.gearAnim);g.visible=S.gearAnim>.05});
  flapL.rotation.x=flapR.rotation.x=S.flaps*.6;
  elevator.rotation.x=S.in.pitch*.4;ailL.rotation.x=S.in.roll*.4;ailR.rotation.x=-S.in.roll*.4;
  prop.visible=cam!==1||true;
  if(cam===0){
    camQ.slerp(S.q,1-Math.exp(-dt*4));
    camera.position.copy(S.pos).add(new V3(0,2.4,9.5).applyQuaternion(camQ));
    camera.quaternion.copy(camQ).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-.1,0,0)));
  }else if(cam===1){
    camera.position.copy(S.pos).add(new V3(0,.62,-.3).applyQuaternion(S.q));
    camera.quaternion.copy(S.q);
  }else{
    camera.position.set(90,groundAt(90,700)+12,700);camera.lookAt(S.pos);
  }
  const g=groundAt(camera.position.x,camera.position.z);
  if(camera.position.y<Math.max(g,0)+1.5)camera.position.y=Math.max(g,0)+1.5;
}
function hud(){
  const e=new THREE.Euler().setFromQuaternion(S.q,'YXZ');
  const hdg=((-e.y*R2D)%360+360)%360;
  const dens=Math.exp(-S.pos.y/8500),ias=S.vel.length()*KT*Math.sqrt(dens);
  const agl=Math.max(0,S.pos.y-Math.max(groundAt(S.pos.x,S.pos.z),0)-1.15);
  hudEl.innerHTML=`<b>IAS</b> ${ias|0} kt<br><b>ALT</b> ${(S.pos.y*FT)|0} ft<br><b>AGL</b> ${(agl*FT)|0} ft<br>`+
    `<b>V/S</b> ${(S.vel.y*FT*60)|0} ft/min<br><b>HDG</b> ${Math.round(hdg)}°<br>`+
    `<b>MOTORE</b> ${Math.round(S.thr*100)}%<br><b>FLAP</b> ${Math.round(S.flaps*100)}% · <b>CARRELLO</b> ${S.gear?'giù':'su'}<br>`+
    `<b>AoA</b> ${(S.alpha*R2D).toFixed(1)}° · <b>TRIM</b> ${(S.trim*R2D).toFixed(1)}°`;
  let w='';
  if(S.stall&&!S.onGround)w='STALL';
  else if(S.pos.y>1&&agl<150&&!S.onGround&&S.gearAnim<.9&&S.thr<.3)w='CARRELLO!';
  warn.style.display=w?'block':'none';warn.textContent=w;
  drawADI(e.x,e.z);
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){inputs(dt);for(let i=0;i<4;i++)step(dt/4)}
  visuals(dt);hud();
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
